<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e7" />
    <meta name="application-name" content="Hephaestus" />
    <meta name="apple-mobile-web-app-title" content="Hephaestus" />
    <meta name="msapplication-TileColor" content="#bd5a3b" />
    <meta name="msapplication-TileImage" content="/assets/hephaestus-icon.png" />
    <title>Hephaestus</title>
    <script>
      (() => {
        const saved = localStorage.getItem("hephaestus-theme");
        const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" href="/assets/hephaestus-icon.svg" />
    <link rel="icon" type="image/png" sizes="1254x1254" href="/assets/hephaestus-icon.png" />
    <link rel="shortcut icon" href="/assets/hephaestus-icon.svg" />
    <link rel="mask-icon" href="/assets/hephaestus-icon.svg" color="#bd5a3b" />
    <link rel="apple-touch-icon" href="/assets/hephaestus-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
